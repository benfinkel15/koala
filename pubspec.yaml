name: koala
description: German language learning app focused on conversational fluency.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.7
  firebase_remote_config: ^5.1.5

  # Local storage / offline cache
  hive_flutter: ^1.1.0

  # Audio & speech
  just_audio: ^0.9.42
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # String matching (speak exercise scoring)
  string_similarity: ^2.1.1

  # Animations
  lottie: ^3.1.3
  flutter_animate: ^4.5.2

  # Immutable models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  freezed: ^3.0.0
  riverpod_generator: ^2.6.3
  json_serializable: ^6.8.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
